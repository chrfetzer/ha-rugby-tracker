<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;--divider-color:rgba(0,0,0,.12);}
body.dark{--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--divider-color:rgba(255,255,255,.12);background:#111}
body{margin:0;padding:16px;background:#f0f0f0;font-family:Roboto,system-ui,sans-serif;color:var(--primary-text-color);display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.w{width:640px}.n{width:360px}
</style></head><body>
<div class="w"><rugby-tracker-card id="a"></rugby-tracker-card></div>
<div class="n"><rugby-tracker-card id="b"></rugby-tracker-card></div>

<script type="module">
await import("../custom_components/rugby_tracker/www/rugby-tracker-card.js?t=" + Date.now());
const attrs = await (await fetch("sample-attrs.json")).json();
const p = new URLSearchParams(location.search);
if (p.get("live")) {
  const m = attrs.matches.find(x => x.state === "pre");
  m.state = "in"; m.status = "STATUS_IN_PROGRESS"; m.clock = "54'"; m.home.score = 17; m.away.score = 24;
  attrs.timelines[m.id] = [
    {type:"try",team_id:m.away.id,player:"Cheslin Kolbe",minute:"6'",period:1},
    {type:"conversion",team_id:m.away.id,player:"Sacha Feinberg-Mngomezulu",minute:"7'",period:1},
    {type:"penalty goal",team_id:m.home.id,player:"Paolo Garbisi",minute:"15'",period:1},
    {type:"yellow card",team_id:m.home.id,player:"Michele Lamaro",minute:"22'",period:1},
    {type:"try",team_id:m.home.id,player:"Ange Capuozzo",minute:"38'",period:1},
    {type:"try",team_id:m.away.id,player:"Damian de Allende",minute:"51'",period:2}];
}
if (p.get("dark")) document.body.classList.add("dark");
const hass = {themes:{darkMode: !!p.get("dark")}, language:"de", locale:{language:"de"}, config:{time_zone:"Europe/Berlin"}, states:{"sensor.south_africa_spiele":{state:"6",attributes:attrs}}};
for (const id of ["a","b"]) { const c = document.getElementById(id); c.setConfig({entity:"sensor.south_africa_spiele", default_tab: p.get("tab") || "upcoming", ...(p.get("badges") ? {badges: p.get("badges")} : {})}); c.hass = hass; }
</script></body></html>
